# Netlify: build the Vite app and serve it as a single-page app.
[build]
  command = "npm run build"
  publish = "dist"

# Client-side routes (/shop, /products/pro-x, ...) all load index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite's hashed bundles never change, so browsers may keep them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
